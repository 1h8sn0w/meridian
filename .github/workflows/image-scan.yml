name: Image Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: [staging, latest]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/meridian:${{ matrix.tag }}
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: published
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.tag }}" = latest ] && grep -q ': not found' <<< "$out"; then
            echo "::notice::Тег latest ще не опубліковано — скан пропущено"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      - if: steps.published.outputs.exists == 'true'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE }}
          only-severities: critical,high
          exit-code: true
          summary: true
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
