# Compose для self-host на будь-якому хості з Docker — без клонування
# репозиторію. Поруч із цим файлом потрібні лише: infra/.env (заповнений під
# цей хост), ./powersync/ і ./caddy/ (конфіги — скопійовані з репозиторію як є,
# без змін). Решта тягнеться готовими образами з реєстру.
#
# Відмінність від infra/docker-compose.yml — рівно одна: `web` бере готовий
# образ замість локальної збірки (MER-58). Це знімає з хоста дві вимоги: мати
# вихідники й уміти їх зібрати. Друга буває просто нездійсненною — на хостах з
# іншою архітектурою CPU (ARM) образ довелось би збирати окремо.
#
# Сам образ не зашитий у файл: namespace реєстру свій у кожного, хто публікує,
# тож він приходить зі змінної WEB_IMAGE (infra/.env). Перелік тегів —
# infra/README.md, розділ «Як розгорнути готовий образ».
#
# Supabase, як і в infra/docker-compose.yml, сюди НЕ входить — офіційний
# compose (~11 сервісів), окремий стек. Порядок обов'язковий: спершу Supabase,
# потім цей файл. Хто такий Supabase і як його піднімати — не міняється
# залежно від хоста, тому не дублюється тут: infra/README.md, розділ
# «1 · Supabase».
#
# GUI-обгортки над Compose (Portainer, Container Manager тощо) зазвичай
# очікують файл саме з іменем docker-compose.yml — при імпорті або
# перейменувати, або вказати назву явно; .env вони підхоплюють із тієї ж теки.
#
# ⚠️ 80/443 мають бути вільні на хості. Якщо там уже живе веб-панель керування
# чи інший реверс-проксі — перевірити й звільнити ДО підняття цього стеку,
# інакше Caddy впаде мовчки на біндингу порту.

name: meridian

services:
  # --- Застосунок ------------------------------------------------------------
  web:
    # Напр. WEB_IMAGE=<namespace>/meridian:staging. Тег `staging`, а не
    # `latest`: поки V2 живе в staging, latest не оновлюється
    # (.github/workflows/docker-publish.yml, MER-58). Після злиття staging →
    # main у змінній буде `:latest`.
    image: '${WEB_IMAGE:?задайте WEB_IMAGE у infra/.env}'
    restart: unless-stopped
    environment:
      PORT: ${WEB_PORT:-3000}
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
      PUBLIC_POWERSYNC_URL: ${PUBLIC_POWERSYNC_URL}
      POWERSYNC_URL: ${POWERSYNC_URL}
    expose:
      - ${WEB_PORT:-3000}

  # --- PowerSync -------------------------------------------------------------
  powersync:
    image: journeyapps/powersync-service:1.23.3
    restart: unless-stopped
    command: ['start', '-r', 'unified']
    volumes:
      - ./powersync:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATABASE_URI: ${PS_DATABASE_URI}
      PS_STORAGE_URI: ${PS_STORAGE_URI}
      PS_JWKS_URL: ${PS_JWKS_URL}
      PS_JWT_SECRET: ${JWT_SECRET}
      PS_PORT: ${PS_PORT:-8080}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:${PS_PORT:-8080}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 1s
      retries: 15
    # Порт відкривається лише на петлі — health-ендпоінт можна смикнути напряму.
    # Ззовні хоста сервіс доступний лише через Caddy.
    ports:
      - 127.0.0.1:${PS_PORT:-8080}:${PS_PORT:-8080}
    networks:
      - default
      - supabase

  # --- Caddy -----------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Реальний домен хоста — у infra/.env: APP_HOST=app.example.com,
      # SYNC_HOST=sync.example.com. Обидва мають A/AAAA-записи на публічну IP
      # хоста (або DDNS), а 80/443 — доходити ззовні. Тоді Caddy сам візьме
      # сертифікат Let's Encrypt, без ручних кроків.
      APP_HOST: ${APP_HOST:-localhost}
      SYNC_HOST: ${SYNC_HOST:-sync.localhost}
      WEB_PORT: ${WEB_PORT:-3000}
      PS_PORT: ${PS_PORT:-8080}
    depends_on:
      - web
      - powersync

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
  # Мережа офіційного compose Supabase (окремий стек на цьому ж хості).
  supabase:
    name: ${SUPABASE_NETWORK:-supabase_default}
    external: true
