# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATABASE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  supabase: true
  jwks_uri: !env PS_JWKS_URL
  supabase_jwt_secret: !env PS_JWT_SECRET
  audience: ['authenticated']

healthcheck:
  probes:
    use_http: true
