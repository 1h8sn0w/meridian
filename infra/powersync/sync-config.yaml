# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Правила синхронізації (MER-46).
#
# Синтаксис узятий з офіційної документації PowerSync — Sync Streams,
# `edition: 3` (docs.powersync.com/sync/streams). Sync Rules зі старим
# `bucket_definitions` там позначені як legacy, тому нового коду на них не
# пишемо. Ім'я ключа в service.yaml — `sync_config`, і воно спільне для обох.
#
# Зміни цього файлу НЕ підхоплюються на льоту — сервіс треба перезапустити:
#   docker compose -f infra/docker-compose.yml restart powersync
#
# --- Що тут вирішено ---------------------------------------------------------
#
# **Ключ синхронізації — `family_id` з JWT.** `auth.parameter('family_id')`
# читає claim верхнього рівня, який кладе хук доступу GoTrue (MER-45). Це те
# саме значення, за яким на сервері працює RLS (`public.current_family_id()`),
# тож правило й політика не можуть розійтися.
#
# Немає claim — немає й даних: порівняння з NULL не збігається з жодним рядком,
# і клієнт бачить порожньо. Для щойно зареєстрованого акаунта без сім'ї це
# правильний стан. Але це ж і головна пастка всієї установки: не ввімкнений хук
# доступу виглядає точно так само — порожньо й без помилок. Перше, що
# перевіряти, — чи є `family_id` у виданому токені (infra/README.md).
#
# **`deleted_at IS NULL` — це і є доставка видалень.** М'яко видалений рядок
# перестає збігатися з запитом, і сервіс прибирає його з пристроїв так само, як
# прибрав би фізично видалений. Тому фізичного DELETE у схемі немає взагалі
# (MER-44): рушій не вміє довозити те, чого в базі вже нема.
#
# **Конфлікти — last-write-wins на рівні рядка, без CRDT.** Це тверде рішення
# інструкції V2, і воно тут не налаштовується: клієнти пишуть через PostgREST
# звичайними UPDATE, `updated_at` ставить тригер бази, тож перемагає та зміна,
# що прийшла на сервер останньою. Для `plan_slot` рядок — це один слот дня,
# тобто «двоє замінили вечерю вівторка» розсуджується саме на тому рівні, на
# якому й обіцяно.
#
# **Один стрім, а не сім.** Документація прямо радить групувати пов'язані
# таблиці в один стрім через `queries` — це дешевше, ніж окремі підписки.
# `auto_subscribe: true` означає, що клієнт отримує ці дані відразу після
# з'єднання й не мусить нічого замовляти окремо.
#
# --- Чого тут свідомо немає --------------------------------------------------
#
# `family`, `family_member`, `family_invite` — облік доступу, а не раціон.
# Екрани сім'ї (MER-45) читають їх напряму через PostgREST, а створення сім'ї
# й запрошення — це RPC, які без мережі однаково не працюють. Тримати їх ще й
# у локальному SQLite означало б два джерела істини для одного екрана.
#
# `pdf_import` — архів джерельного тексту, з якого зроблено страви. Сам імпорт
# переїжджає на сервер (MER-52), а на пристрої від нього потрібні страви, не
# кілобайти вихідного тексту. Знадобиться — додається одним рядком сюди й
# однією таблицею в клієнтську схему.
#
# Ці три місця мають мінятися разом: публікація `powersync` у міграції,
# цей файл і клієнтська схема (apps/web/src/lib/powersync/schema.ts). Забути
# будь-яке з них — тиха поломка: сервер приймає записи, клієнт їх не бачить.

config:
  edition: 3

streams:
  # Усі дані раціону однієї сім'ї. Порядок запитів — від довідників до плану:
  # на вміст синхронізації він не впливає, але читається як модель.
  family_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM profile
        WHERE family_id = auth.parameter('family_id') AND deleted_at IS NULL
      - SELECT * FROM meal
        WHERE family_id = auth.parameter('family_id') AND deleted_at IS NULL
      - SELECT * FROM recipe
        WHERE family_id = auth.parameter('family_id') AND deleted_at IS NULL
      - SELECT * FROM meal_pref
        WHERE family_id = auth.parameter('family_id') AND deleted_at IS NULL
      - SELECT * FROM week_plan
        WHERE family_id = auth.parameter('family_id') AND deleted_at IS NULL
      - SELECT * FROM plan_slot
        WHERE family_id = auth.parameter('family_id') AND deleted_at IS NULL
      - SELECT * FROM shopping_check
        WHERE family_id = auth.parameter('family_id') AND deleted_at IS NULL
