# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Правила синхронізації — задача MER-46. Поки що порожньо: сервіс піднімається
# й відповідає на пробу, але жодних даних клієнтам не віддає. Таблиці, на які
# ці правила посилатимуться, з'являються у MER-44.
#
# Домовленість з інструкції V2: бакет параметризується `family_id` із JWT,
# вибірки фільтруються по сім'ї та `deleted_at is null`. Конфлікти —
# last-write-wins на рівні слота, без CRDT.
#
# Зміни цього файлу НЕ підхоплюються на льоту — сервіс треба перезапустити.

config:
  edition: 3

streams: {}
