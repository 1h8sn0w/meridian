name: meridian

services:
  init:
    image: node:22-alpine
    command: ['node', '/init/generate-secrets.mjs']
    volumes:
      - ./infra/init:/init:ro
      - secrets:/secrets
    restart: 'no'

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -a; . /secrets/app.env; set +a
        exec docker-entrypoint.sh "$$@"
      - sh
    command: ['postgres', '-D', '/etc/postgresql']
    environment:
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
    volumes:
      - secrets:/secrets:ro
      - ./infra/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      init:
        condition: service_completed_successfully

  migrate:
    image: supabase/postgres:17.6.1.136
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -a; . /secrets/app.env; set +a
        export DATABASE_URL="postgresql://postgres:$$POSTGRES_PASSWORD@db:5432/postgres"
        exec sh /db/migrate.sh
    environment:
      STARTER_SET_PATH: /starter/starter-set.json
    volumes:
      - secrets:/secrets:ro
      - ./packages/db:/db:ro
      - type: bind
        source: ${STARTER_SET_FILE:-/dev/null}
        target: /starter/starter-set.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -a; . /secrets/app.env; set +a
        export GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:$$POSTGRES_PASSWORD@db:5432/postgres"
        export GOTRUE_JWT_SECRET="$$JWT_SECRET"
        exec auth
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      API_EXTERNAL_URL: ${APP_URL:-http://localhost}
      GOTRUE_SITE_URL: ${APP_URL:-http://localhost}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: 'true'
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: 'pg-functions://postgres/public/custom_access_token_hook'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    command: ['/bin/postgrest', '/secrets/postgrest.conf']
    volumes:
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  powersync:
    image: journeyapps/powersync-service:1.23.3
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -a; . /secrets/app.env; set +a
        export PS_DATABASE_URI="postgresql://postgres:$$POSTGRES_PASSWORD@db:5432/postgres"
        export PS_STORAGE_URI="$$PS_DATABASE_URI"
        export PS_JWT_SECRET="$$JWT_SECRET"
        exec node service/lib/entry.js "$$@"
      - sh
    command: ['start', '-r', 'unified']
    volumes:
      - ./infra/powersync:/config:ro
      - secrets:/secrets:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_JWKS_URL: http://auth:9999/.well-known/jwks.json
      PS_PORT: 8080
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 2s
      retries: 20
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  caddy:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PUBLIC_SUPABASE_ANON_KEY="$$(. /secrets/app.env; printf %s "$$ANON_KEY")"
        export APP_HOST="$$(printf %s "$$APP_URL" | sed -E 's#^[a-z]+://##; s#[:/].*$$##')"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - '${HTTP_PORT:-80}:${HTTP_PORT:-80}'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp'
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - secrets:/secrets:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_URL: ${APP_URL:-http://localhost}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      PUBLIC_SUPABASE_URL: ${APP_URL:-http://localhost}
      PUBLIC_POWERSYNC_URL: ${APP_URL:-http://localhost}/sync
    depends_on:
      init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      powersync:
        condition: service_started

volumes:
  secrets:
  db-data:
  db-config:
  caddy-data:
  caddy-config:
